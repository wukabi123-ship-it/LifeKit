        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

         ============================== -->

    </title>

        name="description"
        content="Resize JPG, PNG and WEBP images online with LifeKit. Change image width and height to the exact dimensions you need while keeping the aspect ratio."
    >

    <meta

        content="image resizer, resize image online, image resize tool, resize JPG, resize PNG, resize WEBP, image dimensions, photo resizer, LifeKit"
    >

        name="author"
        content="LifeKit"
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <meta
        name="theme-color"
        content="#202124"
    >


    <!-- ==============================
         Canonical
         ============================== -->

    <link
        rel="canonical"
        href="https://lifekit.wukabi123.workers.dev/resizer.html"
    >


    <!-- ==============================
         Favicon
         ============================== -->

    <link
        rel="icon"
        type="image/svg+xml"
        href="favicon.svg"
    >

    <link
        rel="apple-touch-icon"
        href="favicon.svg"
    >


    <!-- ==============================
         Open Graph
         ============================== -->

    <meta
        property="og:title"
        content="Image Resizer — Resize Images Online | LifeKit"
    >

    <meta
        property="og:description"
        content="Resize JPG, PNG and WEBP images online to the exact dimensions you need with LifeKit."
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:url"
        content="https://lifekit.wukabi123.workers.dev/resizer.html"
    >

    <meta
        property="og:site_name"
        content="LifeKit"
    >


    <!-- ==============================
         Twitter / Social Preview
         ============================== -->

    <meta
        name="twitter:card"
        content="summary"
    >

    <meta
        name="twitter:title"
        content="Image Resizer — Resize Images Online | LifeKit"
    >

    <meta
        name="twitter:description"
        content="Resize JPG, PNG and WEBP images online with LifeKit."
    >


    <!-- ==============================
         Structured Data
         ============================== -->

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "LifeKit Image Resizer",
        "url": "https://lifekit.wukabi123.workers.dev/resizer.html",
        "description": "An online image resizer for changing JPG, PNG and WEBP image dimensions.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any"
    }
    </script>


    <!-- ==============================
         Styles
         ============================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==============================
         Header
         ============================== -->

    <header>

        <h1>
            Image Resizer
        </h1>

        <p>
            Resize your images to the exact dimensions you need.
        </p>

    </header>



    <!-- ==============================
         Main
         ============================== -->

    <main>

        <section class="hero">


            <h2>
                Resize Your Image
            </h2>


            <p>
                Choose an image and enter the dimensions you want.
            </p>



            <br>



            <!-- ==============================
                 Drag & Drop Upload
                 ============================== -->

            <div
                id="dropZone"
                class="drop-zone"
            >

                <div class="drop-zone-icon">
                    🖼️
                </div>


                <h3>
                    Drag & Drop Your Image
                </h3>


                <p>
                    or
                </p>


                <label
                    for="imageInput"
                    class="upload-button"
                >
                    Choose Image
                </label>


                <p class="drop-zone-hint">
                    JPG, PNG, WEBP and other image formats
                </p>


                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    hidden
                >

            </div>



            <br><br>



            <!-- ==============================
                 Image Preview
                 ============================== -->

            <img
                id="preview"
                alt="Preview of the selected image"
                style="
                    max-width: 400px;
                    max-height: 400px;
                    display: none;
                "
            >


            <br><br>



            <!-- ==============================
                 Original Dimensions
                 ============================== -->

            <div id="originalDimensions">

                <strong>
                    Original Dimensions:
                </strong>

                —

            </div>



            <br>



            <!-- ==============================
                 Width
                 ============================== -->

            <label for="width">

                <strong>
                    Width:
                </strong>

            </label>


            <br><br>


            <input
                type="number"
                id="width"
                min="1"
                placeholder="Width"
            >


            <span>
                px
            </span>


            <br><br>



            <!-- ==============================
                 Height
                 ============================== -->

            <label for="height">

                <strong>
                    Height:
                </strong>

            </label>


            <br><br>


            <input
                type="number"
                id="height"
                min="1"
                placeholder="Height"
            >


            <span>
                px
            </span>


            <br><br>



            <!-- ==============================
                 Keep Aspect Ratio
                 ============================== -->

            <label>

                <input
                    type="checkbox"
                    id="keepRatio"
                    checked
                >

                Keep aspect ratio

            </label>


            <br><br>



            <!-- ==============================
                 Resize Button
                 ============================== -->

            <button
                id="resizeButton"
                type="button"
            >

                Resize Image

            </button>



            <br><br>



            <!-- ==============================
                 Download Area
                 ============================== -->

            <div id="downloadArea"></div>


        </section>

    </main>



    <!-- ==============================
         Footer
         ============================== -->

    <footer>

        <p>
            © 2026 LifeKit
        </p>

    </footer>



    <!-- ==============================
         JavaScript
         ============================== -->

    <script src="resizer.js"></script>

</body>

</html>
