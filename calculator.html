<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator - LifeKit</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>🔢 Calculator</h1>

        <p>
            A simple calculator for everyday calculations.
        </p>

    </header>


    <main>

        <section class="hero calculator-page">

            <h2>
                Calculator
            </h2>


            <!-- Calculator -->

            <div class="calculator">

                <!-- Display -->

                <div
                    id="calculatorDisplay"
                    class="calculator-display"
                >
                    0
                </div>


                <!-- Buttons -->

                <div class="calculator-buttons">

                    <button
                        class="calculator-button clear"
                        data-action="clear"
                    >
                        AC
                    </button>


                    <button
                        class="calculator-button delete"
                        data-action="delete"
                    >
                        ⌫
                    </button>


                    <button
                        class="calculator-button operator"
                        data-action="percent"
                    >
                        %
                    </button>


                    <button
                        class="calculator-button operator"
                        data-operator="/"
                    >
                        ÷
                    </button>


                    <button
                        class="calculator-button"
                        data-number="7"
                    >
                        7
                    </button>


                    <button
                        class="calculator-button"
                        data-number="8"
                    >
                        8
                    </button>


                    <button
                        class="calculator-button"
                        data-number="9"
                    >
                        9
                    </button>


                    <button
                        class="calculator-button operator"
                        data-operator="*"
                    >
                        ×
                    </button>


                    <button
                        class="calculator-button"
                        data-number="4"
                    >
                        4
                    </button>


                    <button
                        class="calculator-button"
                        data-number="5"
                    >
                        5
                    </button>


                    <button
                        class="calculator-button"
                        data-number="6"
                    >
                        6
                    </button>


                    <button
                        class="calculator-button operator"
                        data-operator="-"
                    >
                        −
                    </button>


                    <button
                        class="calculator-button"
                        data-number="1"
                    >
                        1
                    </button>


                    <button
                        class="calculator-button"
                        data-number="2"
                    >
                        2
                    </button>


                    <button
                        class="calculator-button"
                        data-number="3"
                    >
                        3
                    </button>


                    <button
                        class="calculator-button operator"
                        data-operator="+"
                    >
                        +
                    </button>


                    <button
                        class="calculator-button zero"
                        data-number="0"
                    >
                        0
                    </button>


                    <button
                        class="calculator-button"
                        data-action="decimal"
                    >
                        .
                    </button>


                    <button
                        class="calculator-button equals"
                        data-action="equals"
                    >
                        =
                    </button>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 LifeKit
        </p>

    </footer>


    <script src="calculator.js"></script>

</body>
</html>
