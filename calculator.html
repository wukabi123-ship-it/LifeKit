    >


    <!-- ==============================
         Twitter / Social Preview
         ============================== -->

    <meta
        name="twitter:card"
        content="summary"
    >

    <meta
        name="twitter:title"
        content="Online Calculator — Simple Free Calculator | LifeKit"
    >

    <meta
        name="twitter:description"
        content="Use LifeKit's simple online calculator for everyday calculations."
    >


    <!-- ==============================
         Structured Data
         ============================== -->

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "LifeKit Online Calculator",
        "url": "https://lifekit.wukabi123.workers.dev/calculator.html",
        "description": "A simple online calculator for everyday mathematical calculations.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any"
    }
    </script>


    <!-- ==============================
         Styles
         ============================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==============================
         Header
         ============================== -->

    <header>

        <h1>
            Calculator
        </h1>

        <p>
            A simple calculator for everyday calculations.
        </p>

    </header>



    <!-- ==============================
         Main
         ============================== -->

    <main>

        <section class="hero calculator-page">

            <h2>
                Calculator
            </h2>



            <!-- ==============================
                 Calculator
                 ============================== -->

            <div class="calculator">


                <!-- Display -->

                <div
                    id="calculatorDisplay"
                    class="calculator-display"
                    aria-live="polite"
                >
                    0
                </div>



                <!-- Buttons -->

                <div class="calculator-buttons">


                    <button
                        class="calculator-button clear"
                        data-action="clear"
                        type="button"
                    >
                        AC
                    </button>


                    <button
                        class="calculator-button delete"
                        data-action="delete"
                        type="button"
                        aria-label="Delete"
                    >
                        ⌫
                    </button>


                    <button
                        class="calculator-button operator"
                        data-action="percent"
                        type="button"
                    >
                        %
                    </button>


                    <button
                        class="calculator-button operator"
                        data-operator="/"
                        type="button"
                    >
                        ÷
                    </button>


                    <button
                        class="calculator-button"
                        data-number="7"
                        type="button"
                    >
                        7
                    </button>


                    <button
                        class="calculator-button"
                        data-number="8"
                        type="button"
                    >
                        8
                    </button>


                    <button
                        class="calculator-button"
                        data-number="9"
                        type="button"
                    >
                        9
                    </button>


                    <button
                        class="calculator-button operator"
                        data-operator="*"
                        type="button"
                    >
                        ×
                    </button>


                    <button
                        class="calculator-button"
                        data-number="4"
                        type="button"
                    >
                        4
                    </button>


                    <button
                        class="calculator-button"
                        data-number="5"
                        type="button"
                    >
                        5
                    </button>


                    <button
                        class="calculator-button"
                        data-number="6"
                        type="button"
                    >
                        6
                    </button>


                    <button
                        class="calculator-button operator"
                        data-operator="-"
                        type="button"
                    >
                        −
                    </button>


                    <button
                        class="calculator-button"
                        data-number="1"
                        type="button"
                    >
                        1
                    </button>


                    <button
                        class="calculator-button"
                        data-number="2"
                        type="button"
                    >
                        2
                    </button>


                    <button
                        class="calculator-button"
                        data-number="3"
                        type="button"
                    >
                        3
                    </button>


                    <button
                        class="calculator-button operator"
                        data-operator="+"
                        type="button"
                    >
                        +
                    </button>


                    <button
                        class="calculator-button zero"
                        data-number="0"
                        type="button"
                    >
                        0
                    </button>


                    <button
                        class="calculator-button"
                        data-action="decimal"
                        type="button"
                    >
                        .
                    </button>


                    <button
                        class="calculator-button equals"
                        data-action="equals"
                        type="button"
                    >
                        =
                    </button>


                </div>

            </div>

        </section>

    </main>



    <!-- ==============================
         Footer
         ============================== -->

    <footer>

        <p>
            © 2026 LifeKit
        </p>

    </footer>



    <!-- ==============================
         JavaScript
         ============================== -->

    <script src="calculator.js"></script>

</body>

</html>
