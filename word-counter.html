        type="image/svg+xml"
        href="favicon.svg"
    >

    <link
        rel="apple-touch-icon"
        href="favicon.svg"
    >


    <!-- ==============================
         Open Graph
         ============================== -->

    <meta
        property="og:title"
        content="Word Counter — Count Words & Characters Online | LifeKit"
    >

    <meta
        property="og:description"
        content="Count words, characters, sentences and paragraphs instantly with LifeKit."
    >

    <meta
        property="og:type"
        content="website"
    >

        property="og:url"
        content="https://lifekit.wukabi123.workers.dev/word-counter.html"
    >

        content="LifeKit"
    >


    <!-- ==============================
         Twitter / Social Preview
         ============================== -->

    <meta
        name="twitter:card"
        content="summary"
    >

    <meta
        name="twitter:title"
        content="Word Counter — Count Words & Characters Online | LifeKit"
    >

    <meta
        name="twitter:description"
        content="Count words, characters, sentences and paragraphs instantly with LifeKit."
    >


    <!-- ==============================
         Structured Data
         ============================== -->

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "LifeKit Word Counter",
        "url": "https://lifekit.wukabi123.workers.dev/word-counter.html",
        "description": "An online word counter for counting words, characters, sentences and paragraphs.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any"
    }
    </script>


    <!-- ==============================
         Styles
         ============================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==============================
         Header
         ============================== -->

    <header>

        <h1>
            Word Counter
        </h1>

        <p>
            Count words, characters and sentences instantly.
        </p>

    </header>



    <!-- ==============================
         Main
         ============================== -->

    <main>

        <section class="hero">


            <h2>
                Count Your Text
            </h2>


            <p>
                Type or paste your text below.
            </p>


            <br>



            <!-- ==============================
                 Text Input
                 ============================== -->

            <textarea
                id="textInput"
                placeholder="Type or paste your text here..."
                rows="12"
            ></textarea>


            <br><br>



            <!-- ==============================
                 Statistics
                 ============================== -->

            <div class="word-stats">


                <div class="stat-card">

                    <strong id="wordCount">
                        0
                    </strong>

                    <span>
                        Words
                    </span>

                </div>



                <div class="stat-card">

                    <strong id="characterCount">
                        0
                    </strong>

                    <span>
                        Characters
                    </span>

                </div>



                <div class="stat-card">

                    <strong id="characterNoSpaceCount">
                        0
                    </strong>

                    <span>
                        Characters without spaces
                    </span>

                </div>



                <div class="stat-card">

                    <strong id="sentenceCount">
                        0
                    </strong>

                    <span>
                        Sentences
                    </span>

                </div>



                <div class="stat-card">

                    <strong id="paragraphCount">
                        0
                    </strong>

                    <span>
                        Paragraphs
                    </span>

                </div>


            </div>


            <br>



            <!-- ==============================
                 Clear Button
                 ============================== -->

            <button
                id="clearButton"
                type="button"
            >
                Clear Text
            </button>


        </section>

    </main>



    <!-- ==============================
         Footer
         ============================== -->

    <footer>

        <p>
            © 2026 LifeKit
        </p>

    </footer>



    <!-- ==============================
         JavaScript
         ============================== -->

    <script src="word-counter.js"></script>

</body>

</html>
